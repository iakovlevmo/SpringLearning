<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h3>Search Results</h3>
<hr>
<div>
    <p><b>Search Condition:</b> <span th:text="${lastSearch}"/></p>
</div>
<div th:if="${noResults}">No Results Found</div>
<div th:each="item : ${results}" th:text="${item.name + ' - ' + item.number}"></div>
<br>
<div><a href="/search-page">Go back</a></div>
</body>
</html>
