<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div><b>Add user</b> <a href="/search-page">Search user</a></div>

<form action="#" th:action="@{/add-page}" method="POST">
    <p>
        <label for="name">Enter name:</label>
        <input type="text" id="name" name="name">
    </p>
    <p>
        <label for="phone">Enter phone number:</label>
        <input type="tel" id="phone" name="phone">
    </p>
    <button type="submit">Add</button>
</form>
<p>All data:</p>
<div th:each="item : ${allData}" th:text="${item.name + ' - ' + item.number}"></div>
</body>
</html>
